services:
  mongodb:
    image: mongo:7
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  server:
    build: ./server
    depends_on:
      - mongodb
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/${MONGO_DB:-leitura}
      JWT_SECRET: ${JWT_SECRET:-dev_secret}
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mongodb_data:
