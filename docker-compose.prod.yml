services:
  server:
    build: ./server
    environment:
      PORT: 3000
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
    volumes:
      - caddy_data:/data
    depends_on:
      - server
    restart: unless-stopped

volumes:
  caddy_data:
