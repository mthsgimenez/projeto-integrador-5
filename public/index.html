<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Leitura Fácil</title>

  <!-- Fonte OpenDyslexic (ajuda na leitura) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/open-dyslexic@1.0.3/stylesheet.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #F4F1EA;
      color: #2E2E2E;
      margin: 0;
      padding: 20px;
    }

     header {
      background-color: #A3C9A8;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
    }

    .container {
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
      resize: none;
    }

    .controls {
      margin: 15px 0;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      
    }

    button {
      background-color: #6B8E23;
      color: white;
      border: none;
      padding: 10px 15px;
      margin-right: 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .buttons {
      margin-top: 15px;
    }

    button:hover {
      background-color: #5a7a1d;
    }

    .resultado {
      margin-top: 20px;
      padding: 15px;
      background-color: #d6c8bd;
      border-radius: 10px;
      line-height: 1.8;
      letter-spacing: 1px;
    }

    .config {
      margin-top: 20px;
    }

    select {
      padding: 5px;
      border-radius: 5px;
    }

    .dyslexic {
      font-family: 'OpenDyslexic', Arial, sans-serif;
    }
  </style>
</head>


<body>

  <header>
  Leitura Fácil 💚
  </header>

  <div class="container">

   <h3>Digite ou cole seu texto:</h3>

  <textarea id="texto"></textarea>

    <div class="controls">
      <button onclick="adaptarTexto()">Adaptar Texto</button>
      <button onclick="increaseSpacing()">+ Espaçamento</button>
      <button onclick="decreaseSpacing()">- Espaçamento</button>
      <button onclick="lerTexto()">▶️ Ler</button>
      <button onclick="pausarTexto()">⏸️ Pausar</button>
      <button onclick="continuarTexto()">▶️ Continuar</button>
      <button onclick="pararTexto()">⛔ Parar</button>
    </div>

    <br>

    <div class="config">
    <label>Fonte:</label>
    <select onchange="mudarFonte(this.value)">
      <option value="Arial">Normal</option>
      <option value="Verdana">Mais legível</option>
    </select>
    </div>

    <br><br>

    <label>Velocidade:</label>
    <input type="range" min="0.5" max="2" step="0.1" value="1" id="velocidade">

    <br><br>

    <label>Voz:</label>
    <select id="vozes"></select>

    <br><br>

    <div class="resultado" id="resultado">
      Seu texto adaptado aparecerá aqui...
    </div>

<script>
    let spacing = 1.6;
    let dyslexicFont = false;

    function toggleFont() {
      const output = document.getElementById('resultado');
      dyslexicFont = !dyslexicFont;
      output.classList.toggle('dyslexic');
    }

    function increaseSpacing() {
      spacing += 0.2;
      document.getElementById('resultado').style.lineHeight = spacing;
    }

    function decreaseSpacing() {
      if (spacing > 1) {
        spacing -= 0.2;
        document.getElementById('resultado').style.lineHeight = spacing;
      }
    }

    function readText() {
      const text = document.getElementById('resultado').innerText;
      if (!text) return;

      const speech = new SpeechSynthesisUtterance(text);
      speech.lang = 'pt-BR';
      window.speechSynthesis.speak(speech);
    }

    function adaptarTexto() {
      let texto = document.getElementById("texto").value;

      // Simples adaptação: aumenta espaçamento e quebra frases
      let adaptado = texto.replace(/\./g, ".<br><br>");

      document.getElementById("resultado").innerHTML = adaptado;
    }

    function lerTexto() {
      let texto = document.getElementById("resultado").innerText;

      // Cancela qualquer fala anterior antes de começar outra
      speechSynthesis.cancel();

      let fala = new SpeechSynthesisUtterance(texto);
      speechSynthesis.speak(fala);
    }

    function mudarFonte(fonte) {
      document.getElementById("resultado").style.fontFamily = fonte;
    }

    let synth = speechSynthesis;
    let utterance;

    // Carregar vozes disponíveis
    function carregarVozes() {
      let select = document.getElementById("vozes");
      let vozes = synth.getVoices();

      select.innerHTML = "";

      vozes.forEach((voz, index) => {
        let option = document.createElement("option");
        option.value = index;
        option.textContent = voz.name + " (" + voz.lang + ")";
        select.appendChild(option);
      });
    }

    // Alguns navegadores precisam disso
    speechSynthesis.onvoiceschanged = carregarVozes;

    function lerTexto() {
      let texto = document.getElementById("resultado").innerText;

      synth.cancel(); // limpa antes de começar

      utterance = new SpeechSynthesisUtterance(texto);

      // velocidade
      let velocidade = document.getElementById("velocidade").value;
      utterance.rate = velocidade;

      // voz escolhida
      let vozes = synth.getVoices();
      let index = document.getElementById("vozes").value;
      utterance.voice = vozes[index];

      synth.speak(utterance);
    }

    function pausarTexto() {
      if (synth.speaking && !synth.paused) {
        synth.pause();
      }
    }

    function continuarTexto() {
      if (synth.paused) {
        synth.resume();
      }
    }

    function pararTexto() {
      synth.cancel();
    }
</script>
</body>
</html>
